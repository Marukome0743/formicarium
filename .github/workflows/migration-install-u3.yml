name: U3 provisional install integration verification
on:
  push:
    branches: [codex/terrarium-migration-u3]
permissions:
  contents: read
concurrency:
  group: migration-install-u3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Marukome0743/formicarium' && github.ref == 'refs/heads/codex/terrarium-migration-u3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Bind observed absolute Bun executable
        shell: bash
        run: |
          bun_executable="$(command -v bun)"
          [[ "$bun_executable" = /* && -x "$bun_executable" ]]
          [[ "$("$bun_executable" --version)" = '1.4.2' ]]
          printf 'BUN_EXECUTABLE=%s\nFORMICARIUM_CI_BUN=%s\n' "$bun_executable" "$bun_executable" >> "$GITHUB_ENV"
          printf 'Observed Bun executable: %s\n' "$bun_executable"
      - run: node scripts/ci/tasks.ts install-frozen --cacheless
      - run: node scripts/ci/tasks.ts build
      - run: node scripts/ci/tasks.ts typecheck
      - name: Restore verified actual distribution before any required test process
        shell: bash
        run: |
          node scripts/migration-install/ci-inputs.js restore ci/migration-install/inputs.bundle.json
          printf 'U2_ACTUAL_SITE=%s/.artifacts/migration-install/actual-site\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - run: node --test --test-concurrency=1 tests/migration-session/ci.test.js tests/migration-install/acceptance.test.js
      - name: Restore fixed core objects from unchanged accepted local object bundle
        run: node scripts/migration-session/ci-core.js ci/migration-session/inputs.bundle.json
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Prepare current U3 inputs and independent consumer
        run: node scripts/migration-install/ci.js prepare ci/migration-install/inputs.bundle.json "$RUNNER_TEMP/formicarium-u3-consumer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .artifacts/migration-install/ci-context.json
      - name: Create job-only localhost leaf certificate and explicit trust
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          mkdir -p .artifacts/migration-install/tls "$HOME/.pki/nssdb"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj '/CN=formicarium-u3-job-localhost' -addext 'subjectAltName=DNS:localhost' -addext 'basicConstraints=critical,CA:FALSE' -addext 'keyUsage=critical,digitalSignature,keyEncipherment' -addext 'extendedKeyUsage=serverAuth' -keyout .artifacts/migration-install/tls/localhost-key.pem -out .artifacts/migration-install/tls/localhost-cert.pem
          chmod 600 .artifacts/migration-install/tls/localhost-key.pem
          sudo install -m 644 .artifacts/migration-install/tls/localhost-cert.pem /usr/local/share/ca-certificates/formicarium-u3-job-localhost.crt
          sudo update-ca-certificates
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n formicarium-u3-job-localhost -t 'P,,' -i .artifacts/migration-install/tls/localhost-cert.pem
          tls_sha="$(openssl x509 -in .artifacts/migration-install/tls/localhost-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$tls_sha" =~ ^[a-f0-9]{64}$ ]]
          printf 'FORMICARIUM_INSTALL_TLS_CERT=%s/.artifacts/migration-install/tls/localhost-cert.pem\nFORMICARIUM_INSTALL_TLS_KEY=%s/.artifacts/migration-install/tls/localhost-key.pem\nFORMICARIUM_INSTALL_TLS_SHA256=%s\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$tls_sha" >> "$GITHUB_ENV"
      - name: Sequential suites, fresh21JS allrealms coverage and formal36 trials
        run: node scripts/migration-install/ci.js verify .artifacts/migration-install/ci-context.json
      - name: Remove only this job localhost trust and private key
        if: always()
        shell: bash
        run: |
          if [[ -f /usr/local/share/ca-certificates/formicarium-u3-job-localhost.crt ]]; then
            expected="$(openssl x509 -in .artifacts/migration-install/tls/localhost-cert.pem -noout -fingerprint -sha256)"
            actual="$(openssl x509 -in /usr/local/share/ca-certificates/formicarium-u3-job-localhost.crt -noout -fingerprint -sha256)"
            [[ "$actual" = "$expected" ]]
            sudo rm -- /usr/local/share/ca-certificates/formicarium-u3-job-localhost.crt
            sudo update-ca-certificates
            certutil -D -d "sql:$HOME/.pki/nssdb" -n formicarium-u3-job-localhost
          fi
          rm -f -- .artifacts/migration-install/tls/localhost-key.pem
      - name: Preserve current metadata, raw command logs and all realm/trial observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-install-u3-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/migration-install/ci-context.json
            .artifacts/migration-session/core-restore.json
            .artifacts/migration-install/candidate-*/package.manifest.json
            .artifacts/migration-install/ci-execution-*/*.log
            .artifacts/migration-install/completion-*/local-provisional-report.json
            .artifacts/migration-install/completion-*/ci-job-observations.json
            .artifacts/migration-install/completion-*/incomplete.json
            .artifacts/migration-install/completion-*/coverage/coverage-report.json
            .artifacts/migration-install/completion-*/coverage/coverage-metadata.json
            .artifacts/migration-install/completion-*/coverage/coverage-node*.json
            .artifacts/migration-install/completion-*/coverage/coverage-session-node*.json
            .artifacts/migration-install/completion-*/coverage/install-collection-boundary.json
            .artifacts/migration-install/completion-*/coverage/coverage-playwright-generation.json
            .artifacts/migration-install/completion-*/coverage/coverage-playwright-node/**/*.json
            .artifacts/migration-install/completion-*/coverage/coverage-playwright-node/**/*.jsonl
            .artifacts/migration-install/completion-*/coverage/**/coverage-realms.json
            .artifacts/migration-install/completion-*/measurement/measurement-report.json
            .artifacts/migration-install/completion-*/measurement/trials/*.json
            .artifacts/migration-install/completion-*/measurement/incomplete.json
